[project]
name = "weather-app"
version = "0.1.0"
description = "Simple weather app written in Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["requests>=2.34.2"]

[project.scripts]
weather-app = "weather_app:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
